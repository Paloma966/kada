name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ========== Go lint ==========
  backend-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m

  # ========== Go backend tests ==========
  backend-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kada
          POSTGRES_PASSWORD: kada123
          POSTGRES_DB: kada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://kada:kada123@localhost:5432/kada_test?sslmode=disable
          JWT_SECRET: test-secret
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 7

  # ========== Frontend lint ==========
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  # ========== Frontend build check ==========
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ========== Deploy to production server ==========
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---- Build backend ----
      - name: Build Go binaries
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/server ./cmd/server/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/migrate ./cmd/migrate/

      # ---- Build frontend ----
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package frontend
        run: |
          cd frontend
          mkdir -p ../deploy-pkg
          tar czf ../deploy-pkg/kada-fe-standalone.tar.gz -C .next/standalone .
          tar czf ../deploy-pkg/kada-fe-static.tar.gz -C .next static/

      # ---- Deploy ----
      - name: Create deploy marker
        run: |
          echo "${{ github.sha }}" > deploy-version.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deploy-version.txt

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "backend/bin/server,backend/bin/migrate,deploy-pkg/*,deploy-version.txt"
          target: /tmp/kada-deploy/
          strip_components: 0

      - name: Migrate schema & restart services
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DATABASE_URL
          script: |
            set -e
            echo "📦 Starting deploy: $(cat /tmp/kada-deploy/deploy-version.txt | head -1)"

            # ---- 1. Back up the current version (enables rollback) ----
            echo "💾 Backing up current version..."
            mkdir -p /opt/kada/backups
            cp /opt/kada/backend/bin/server /opt/kada/backups/server.$(date +%Y%m%d%H%M%S) 2>/dev/null || true
            # Keep the 5 most recent backups
            ls -t /opt/kada/backups/server.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

            # ---- 2. Apply the database schema ----
            # The schema is defined by the GORM models in backend/internal/domain/entity and applied by
            # cmd/migrate (AutoMigrate). It only ever adds missing tables/columns/indexes — nothing is
            # dropped — so it is safe to run on every deploy, and it runs BEFORE the new binary starts.
            echo "🗄️  Applying schema..."
            cp -f /tmp/kada-deploy/backend/bin/migrate /opt/kada/backend/bin/migrate
            chmod +x /opt/kada/backend/bin/migrate
            cd /opt/kada/backend && DATABASE_URL="$DATABASE_URL" ./bin/migrate

            # ---- 3. Replace backend ----
            echo "🔄 Replacing backend..."
            systemctl stop kada-api
            cp /tmp/kada-deploy/backend/bin/server /opt/kada/backend/bin/server
            chmod +x /opt/kada/backend/bin/server
            systemctl start kada-api
            sleep 2

            # ---- Health check ----
            if systemctl is-active --quiet kada-api; then
              echo "✅ Backend started successfully"
            else
              echo "❌ Backend failed to start — rolling back!"
              cp /opt/kada/backups/server.* /opt/kada/backend/bin/server 2>/dev/null || true
              systemctl start kada-api || true
              exit 1
            fi

            # ---- 4. Replace frontend ----
            echo "🔄 Replacing frontend..."
            cd /opt/kada/frontend
            rm -rf .next/static node_modules server.js package.json static 2>/dev/null || true
            tar xzf /tmp/kada-deploy/deploy-pkg/kada-fe-standalone.tar.gz
            mkdir -p .next
            tar xzf /tmp/kada-deploy/deploy-pkg/kada-fe-static.tar.gz -C .next

            # ---- 5. Restart frontend ----
            systemctl restart kada-frontend
            sleep 2
            if systemctl is-active --quiet kada-frontend; then
              echo "✅ Frontend restarted"
            else
              echo "⚠️  Frontend may have issues — check logs"
            fi

            # ---- 6. Cleanup ----
            rm -rf /tmp/kada-deploy
            cp /opt/kada/backend/bin/server -v 2>/dev/null || true
            echo "🚀 Deploy complete: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify deployment
        run: |
          sleep 3
          echo "=== Health Check ==="
          curl -sf http://${{ secrets.SERVER_HOST }}/api/health && echo "" || echo "❌ Health check failed"
          echo "=== Frontend ==="
          curl -sf -o /dev/null -w "Frontend: HTTP %{http_code}\n" http://${{ secrets.SERVER_HOST }}/ || echo "❌ Frontend check failed"
          echo "=== QR Code ==="
          curl -sf -o /dev/null -w "QR API: HTTP %{http_code}\n" http://${{ secrets.SERVER_HOST }}/api/links || echo "⚠️  API check"

  # ========== Summary ==========
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build, deploy]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## 🚀 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          declare -A results
          results[backend-lint]="${{ needs.backend-lint.result }}"
          results[backend-test]="${{ needs.backend-test.result }}"
          results[frontend-lint]="${{ needs.frontend-lint.result }}"
          results[frontend-build]="${{ needs.frontend-build.result }}"
          results[deploy]="${{ needs.deploy.result }}"

          for job in backend-lint backend-test frontend-lint frontend-build deploy; do
            result="${results[$job]}"
            case "$result" in
              success) icon="✅" ;;
              skipped) icon="⏭️" ;;
              failure) icon="❌" ;;
              *) icon="⚠️" ;;
            esac
            echo "| $job | $icon $result |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
