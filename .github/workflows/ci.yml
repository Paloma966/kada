name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ----- Go lint -----
  backend-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m

  # ----- Go tests -----
  backend-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kada
          POSTGRES_PASSWORD: kada123
          POSTGRES_DB: kada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://kada:kada123@localhost:5432/kada_test?sslmode=disable
          JWT_SECRET: test-secret
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 7

  # ----- Frontend lint -----
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  # ----- Frontend build -----
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          # "same-origin" makes the bundle issue relative requests: nginx serves the frontend and proxies
          # /api/ to the Go backend. The sentinel is used instead of an empty value because the bundler
          # only inlines a non-empty NEXT_PUBLIC_* - see the note in src/lib/api.ts.
          NEXT_PUBLIC_API_URL: "same-origin"
        run: npm run build

  # ----- AI service (Python) -----
  # The Python service fails at request time, not at import time: a missing
  # embedding SDK or an image that cannot run passes every startup check and then
  # breaks when a user asks a question. So this job builds the real image,
  # asserts the SDK is inside it, and boots the service against a real PostgreSQL
  # to hit /healthz.
  ai-build:
    name: AI Service Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the AI image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ai
          push: false
          load: true
          tags: kada-ai:ci
          # The Dockerfile defaults to the Tsinghua mirror for domestic servers;
          # the runner is outside China, so install from PyPI directly.
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the embedding SDK is installed
        # DashScopeEmbeddings imports the `dashscope` package lazily, on the
        # first retrieval, so a requirements.txt that forgot it passes every
        # startup check and then fails every chat request. Constructing the
        # client is what catches it.
        run: |
          docker run --rm kada-ai:ci python -c "from langchain_community.embeddings import DashScopeEmbeddings; DashScopeEmbeddings(model='text-embedding-v3', dashscope_api_key='ci-placeholder'); print('dashscope SDK is importable')"

      - name: Check the per-user tool credential
        # The tools that call the Go API must run as the caller, refuse to run
        # without a credential, and never leak one request's token into another's.
        run: |
          docker run --rm -i kada-ai:ci python - <<'PY'
          import asyncio

          from app.service import kada_tools


          async def main():
              refused = await kada_tools.get_link_overview.ainvoke({})
              assert refused == kada_tools._NO_CREDENTIAL, refused

              kada_tools.set_request_token("token-a")
              assert kada_tools._headers()["Authorization"] == "Bearer token-a"

              async def who(token):
                  kada_tools.set_request_token(token)
                  await asyncio.sleep(0)
                  return kada_tools._request_token.get()

              seen = await asyncio.gather(who("a"), who("b"))
              assert seen == ["a", "b"], f"credential leaked across tasks: {seen}"
              print("per-user tool credentials behave")


          asyncio.run(main())
          PY

      - name: Smoke test the service against a real database
        run: |
          set -euo pipefail

          docker network create kada-ai-ci
          docker run -d --name kada-ci-pg --network kada-ai-ci \
            -e POSTGRES_USER=kada -e POSTGRES_PASSWORD=kada123 -e POSTGRES_DB=kada_ai \
            pgvector/pgvector:pg16

          # init_db() runs in the lifespan hook, so the database has to answer first.
          ready=""
          for _ in $(seq 1 30); do
            if docker exec kada-ci-pg pg_isready -U kada -d kada_ai >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then docker logs kada-ci-pg; exit 1; fi

          # No Redis and no provider keys: Redis is fail-open and the keys are
          # only needed once a question arrives, so /healthz must answer anyway.
          docker run -d --name kada-ci-ai --network kada-ai-ci -p 127.0.0.1:8000:8000 \
            -e POSTGRES_URL=postgresql+asyncpg://kada:kada123@kada-ci-pg:5432/kada_ai \
            -e AI_INTERNAL_SECRET=ci-internal-secret \
            kada-ai:ci

          up=""
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/healthz; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then docker logs kada-ci-ai; exit 1; fi

          # The gateway guard: /healthz stays open (compose and the deploy script
          # call it), while a business route must refuse a caller that cannot
          # prove it came through the gateway - and answer one that can.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/conversations/current)
          if [ "$code" != "401" ]; then echo "no internal secret: HTTP $code, want 401"; exit 1; fi

          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Internal-Secret: wrong' http://127.0.0.1:8000/conversations/current)
          if [ "$code" != "401" ]; then echo "wrong internal secret: HTTP $code, want 401"; exit 1; fi

          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Internal-Secret: ci-internal-secret' -H 'X-Kada-User-ID: 1' http://127.0.0.1:8000/conversations/current)
          if [ "$code" != "200" ]; then echo "valid internal secret: HTTP $code, want 200"; exit 1; fi
          echo "gateway guard behaves"

  # ----- Deploy to production -----
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build, ai-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Go binaries
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/server ./cmd/server/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/migrate ./cmd/migrate/

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          # Same-origin deployment, see the note on the frontend-build job above.
          NEXT_PUBLIC_API_URL: "same-origin"
        run: npm run build

      - name: Package frontend
        run: |
          cd frontend
          mkdir -p ../deploy-pkg
          tar czf ../deploy-pkg/kada-fe-standalone.tar.gz -C .next/standalone .
          tar czf ../deploy-pkg/kada-fe-static.tar.gz -C .next static/

      # The AI service is built into an image on the host, so the deploy ships
      # its source rather than a binary; see deploy/deploy-ai.sh.
      - name: Package the AI service
        run: |
          mkdir -p deploy-pkg
          tar czf deploy-pkg/kada-ai-src.tar.gz -C backend/ai \
            --exclude='*__pycache__*' --exclude='*.pyc' .

      - name: Create deploy marker
        run: |
          echo "${{ github.sha }}" > deploy-version.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deploy-version.txt

      - name: Upload artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "backend/bin/server,backend/bin/migrate,deploy-pkg/*,deploy-version.txt,deploy/deploy-ai.sh,deploy/upsert-env.sh,deploy/docker-compose.ai.yml"
          target: /tmp/kada-deploy/
          strip_components: 0

      # Whether the deployment may proceed is decided on the host, by the --require checks in the deploy
      # step below: they read /opt/kada/backend/.env as it will actually be after the sync, which is the
      # truth. This step cannot see that file, so it must not pretend to: it only reports whether CI is
      # *managing* these four values, and it never fails the job.
      #
      # That distinction matters in both directions. A missing secret here does not necessarily mean an
      # outage - a hand-configured host keeps working, because --set with an empty value leaves the file
      # alone - so claiming "nobody can sign in" would be a false alarm, and false alarms are how real ones
      # get ignored. It is still worth saying, because a value that only exists on the server is lost when
      # the server is rebuilt.
      - name: Check the SMS credentials
        env:
          SMS_ACCESS_KEY_ID: ${{ secrets.SMS_ACCESS_KEY_ID }}
          SMS_ACCESS_KEY_SECRET: ${{ secrets.SMS_ACCESS_KEY_SECRET }}
          SMS_SIGN_NAME: ${{ secrets.SMS_SIGN_NAME }}
          SMS_TEMPLATE_CODE: ${{ secrets.SMS_TEMPLATE_CODE }}
        run: |
          missing=""
          for name in SMS_ACCESS_KEY_ID SMS_ACCESS_KEY_SECRET SMS_SIGN_NAME SMS_TEMPLATE_CODE; do
            if [ -z "${!name}" ]; then
              missing="${missing:+$missing, }$name"
            fi
          done

          if [ -z "$missing" ]; then
            echo "the SMS credentials are managed by this repository"
            exit 0
          fi

          {
            echo "### Note: CI does not manage the SMS credentials"
            echo ""
            echo "Not set as repository secrets: \`$missing\`"
            echo ""
            echo "The deployment is not blocked by this - the check that decides runs on the host, against"
            echo "\`/opt/kada/backend/.env\`, where these values may already be configured by hand. But as"
            echo "long as they are not set here, they live only on that machine: rebuilding the host, or"
            echo "rotating the credential, means editing it over SSH by hand again."
            echo ""
            echo "| Secret | Where it comes from |"
            echo "|---|---|"
            echo "| \`SMS_ACCESS_KEY_ID\` / \`SMS_ACCESS_KEY_SECRET\` | Aliyun RAM AccessKey pair with SMS permission |"
            echo "| \`SMS_SIGN_NAME\` / \`SMS_TEMPLATE_CODE\` | The system-granted signature and template in the Aliyun PNVS console |"
            echo ""
            echo "Phone number plus SMS code is the only sign-in method, so if the host is *also* missing"
            echo "them, nobody can sign in and the deploy will fail at the sync step."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=CI does not manage the SMS credentials::$missing is not set as a repository secret; the deploy checks the host's own .env instead."

      - name: Apply schema and restart services
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The provider keys live here rather than in a file someone edits over SSH. "The AI page is
          # broken" and "the SMS code never arrives" were both, in the end, an empty line in
          # /opt/kada/ai/ai.env or /opt/kada/backend/.env that nothing had ever checked; see
          # deploy/upsert-env.sh for how these are written and why the deployment stops when they are
          # missing.
          #
          # Add them under Settings -> Secrets and variables -> Actions:
          #   DEEPSEEK_API_KEY      chat model key
          #   DASHSCOPE_API_KEY     Aliyun Bailian embedding key (written to ai.env as `aliyun`)
          #   AI_INTERNAL_SECRET    openssl rand -hex 32; written to BOTH sides so they cannot disagree
          #   SMS_ACCESS_KEY_ID / SMS_ACCESS_KEY_SECRET / SMS_SIGN_NAME / SMS_TEMPLATE_CODE
          #                         the Aliyun PNVS credentials; without them nobody can sign in
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          AI_INTERNAL_SECRET: ${{ secrets.AI_INTERNAL_SECRET }}
          SMS_ACCESS_KEY_ID: ${{ secrets.SMS_ACCESS_KEY_ID }}
          SMS_ACCESS_KEY_SECRET: ${{ secrets.SMS_ACCESS_KEY_SECRET }}
          SMS_SIGN_NAME: ${{ secrets.SMS_SIGN_NAME }}
          SMS_TEMPLATE_CODE: ${{ secrets.SMS_TEMPLATE_CODE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # This step builds the AI image on the host, and pip installing the LangChain
          # stack takes minutes on a small server. The action's default is 10m, which a
          # first build can exceed - and it would fail the deploy after the API and the
          # frontend had already been replaced.
          command_timeout: 30m
          envs: DATABASE_URL,DEEPSEEK_API_KEY,DASHSCOPE_API_KEY,AI_INTERNAL_SECRET,SMS_ACCESS_KEY_ID,SMS_ACCESS_KEY_SECRET,SMS_SIGN_NAME,SMS_TEMPLATE_CODE
          script: |
            set -euo pipefail

            DEPLOY_DIR=/tmp/kada-deploy
            BACKEND_DIR=/opt/kada/backend
            FRONTEND_DIR=/opt/kada/frontend

            echo "Deploying $(head -1 "$DEPLOY_DIR/deploy-version.txt")"

            # 0. Sync the secrets BEFORE touching anything on this host.
            #
            #    Placement is the whole point: a missing key must fail the deployment while every service
            #    is still running the previous, working build. Run this after step 3 and a forgotten
            #    secret would take the site down and only then say why.
            #
            #    --set with an empty value keeps whatever the file already holds, so a host configured by
            #    hand keeps working; --require is what makes "nothing there at all" a hard failure.
            echo "Syncing secrets into the runtime env files"
            bash "$DEPLOY_DIR/deploy/upsert-env.sh" /opt/kada/ai/ai.env \
              --set "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" \
              --set "aliyun=$DASHSCOPE_API_KEY" \
              --set "AI_INTERNAL_SECRET=$AI_INTERNAL_SECRET" \
              --require DEEPSEEK_API_KEY \
              --require aliyun \
              --require AI_INTERNAL_SECRET

            # The gateway reads AI_INTERNAL_SECRET from its own .env, and the AI service reads it from
            # ai.env. Writing both from the same secret is the only way they cannot end up different -
            # which is what a 401 "only the Go gateway may call this service" always means.
            #
            # The SMS credentials are required too, and for the same reason as the AI keys: phone number
            # plus SMS code is the only way to sign in, so a host without them serves a site nobody can log
            # into. Checking them here is what makes that a refused deploy instead of a quiet outage. The
            # check reads the file, not the repository secrets, so a host that was configured by hand keeps
            # deploying normally.
            bash "$DEPLOY_DIR/deploy/upsert-env.sh" "$BACKEND_DIR/.env" \
              --set "AI_INTERNAL_SECRET=$AI_INTERNAL_SECRET" \
              --set "SMS_ACCESS_KEY_ID=$SMS_ACCESS_KEY_ID" \
              --set "SMS_ACCESS_KEY_SECRET=$SMS_ACCESS_KEY_SECRET" \
              --set "SMS_SIGN_NAME=$SMS_SIGN_NAME" \
              --set "SMS_TEMPLATE_CODE=$SMS_TEMPLATE_CODE" \
              --require AI_INTERNAL_SECRET \
              --require SMS_ACCESS_KEY_ID \
              --require SMS_ACCESS_KEY_SECRET \
              --require SMS_SIGN_NAME \
              --require SMS_TEMPLATE_CODE

            # 1. Back up the running binary so a failed start can be rolled back.
            echo "Backing up the current binary"
            mkdir -p "$BACKEND_DIR/backups"
            cp "$BACKEND_DIR/bin/server" "$BACKEND_DIR/backups/server.$(date +%Y%m%d%H%M%S)" 2>/dev/null || true
            ls -t "$BACKEND_DIR"/backups/server.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

            # 2. Apply the database schema.
            # The schema is defined by the GORM models in backend/internal/domain/entity and applied by
            # cmd/migrate: it reconciles legacy constraint names, then runs AutoMigrate (additive only).
            # It reads DATABASE_URL from the environment when the secret is set, and otherwise from
            # /opt/kada/backend/.env through godotenv, which is how this host is configured.
            echo "Applying the database schema"
            cp -f "$DEPLOY_DIR/backend/bin/migrate" "$BACKEND_DIR/bin/migrate"
            chmod +x "$BACKEND_DIR/bin/migrate"
            cd "$BACKEND_DIR" && DATABASE_URL="$DATABASE_URL" ./bin/migrate

            # 3. Replace the backend binary.
            echo "Restarting the backend"
            systemctl stop kada-api
            cp "$DEPLOY_DIR/backend/bin/server" "$BACKEND_DIR/bin/server"
            chmod +x "$BACKEND_DIR/bin/server"
            systemctl start kada-api
            sleep 2

            if ! systemctl is-active --quiet kada-api; then
              echo "kada-api failed to start, rolling back"
              cp "$BACKEND_DIR"/backups/server.* "$BACKEND_DIR/bin/server" 2>/dev/null || true
              systemctl start kada-api || true
              exit 1
            fi
            echo "kada-api is running"

            # 4. Replace the frontend build.
            echo "Deploying the frontend"
            cd "$FRONTEND_DIR"
            rm -rf .next/static node_modules server.js package.json static 2>/dev/null || true
            tar xzf "$DEPLOY_DIR/deploy-pkg/kada-fe-standalone.tar.gz"
            mkdir -p .next
            tar xzf "$DEPLOY_DIR/deploy-pkg/kada-fe-static.tar.gz" -C .next

            # 5. Restart the frontend.
            systemctl restart kada-frontend
            sleep 2
            if ! systemctl is-active --quiet kada-frontend; then
              echo "kada-frontend is not active after restart"
              journalctl -u kada-frontend -n 30 --no-pager || true
              exit 1
            fi
            echo "kada-frontend is running"

            # 6. Verify on the host itself. This is the authoritative check: it does not depend on DNS,
            #    TLS or the public network, only on the API answering. The public check further below
            #    runs on the runner and then proves nginx and TLS are fine too.
            echo "Checking the API on the host"
            if ! curl -sS --fail --max-time 10 http://127.0.0.1:8080/api/health | grep -q '"status":"ok"'; then
              echo "the API is not answering on 127.0.0.1:8080"
              journalctl -u kada-api -n 30 --no-pager || true
              exit 1
            fi
            echo "API answered on the host"

            # 7. Deploy the Python AI service. A Python service is not a binary to
            #    copy: the source is synced and the image is built here on the
            #    host. deploy/deploy-ai.sh is the same script `make deploy-ai`
            #    runs; it ends by waiting for /healthz and rolls back to the
            #    previous image when the new one does not come up.
            #    It needs /opt/kada/ai/ai.env and the kada_ai database to already
            #    exist - see deploy/ai.env.example and deploy/setup-ai-db.sh.
            echo "Deploying the AI service"
            mkdir -p /opt/kada/ai
            cp -f "$DEPLOY_DIR/deploy/docker-compose.ai.yml" /opt/kada/ai/docker-compose.yml
            cp -f "$DEPLOY_DIR/deploy/deploy-ai.sh" /opt/kada/ai/deploy-ai.sh
            cp -f "$DEPLOY_DIR/deploy-pkg/kada-ai-src.tar.gz" /tmp/kada-ai-src.tar.gz
            bash /opt/kada/ai/deploy-ai.sh
            echo "the AI service is running"

            # 8. Clean up.
            rm -rf "$DEPLOY_DIR" /tmp/kada-ai-src.tar.gz
            echo "Deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # A reachability smoke test from the runner, covering DNS, TLS and nginx as a visitor sees them.
      #
      # It does NOT decide whether the deployment failed. The authoritative check is the one that ran on
      # the host during the deploy step (curl http://127.0.0.1:8080/api/health): it depends on nothing but
      # the API answering. A runner reaching this host goes through an edge that is entitled to refuse
      # connections from a datacenter - it answered `Connection reset by peer` (curl 35) during a TLS
      # handshake even while the same URL returned 200 from elsewhere - and gating a deployment on a third
      # party's tolerance for our IP range is not a check, it is a coin flip.
      #
      # This step absorbs that refusal instead of letting curl raise it: `continue-on-error` stops it from
      # failing the run, but it does not stop a non-zero curl from being announced as an error annotation
      # with a red X next to a deployment that in fact succeeded. A refusal is a fact to record, not an
      # error to raise, so the result is written to files and reported by the step below either way.
      - name: Verify deployment
        id: verify
        continue-on-error: true
        env:
          # The public origin is not a secret: it is in the certificate transparency logs, the DNS records
          # and nginx/nginx-prod.conf, which is where this default comes from. Override the SITE_URL
          # repository variable when a deployment serves a different name.
          SITE_ORIGIN: ${{ vars.SITE_URL || 'https://kada.click' }}
        run: |
          # Accept a bare hostname too, so "kada.click" fails on the network instead of reporting
          # `Protocol "kada.click" not supported`. Strip trailing slashes so "$BASE/api/health" stays sound.
          case "$SITE_ORIGIN" in
            http://* | https://*) BASE="$SITE_ORIGIN" ;;
            *) BASE="https://$SITE_ORIGIN" ;;
          esac
          BASE="${BASE%/}"

          # An empty host makes "https:///api/health", which curl reports as an unresolvable host called
          # "api" - a message that sends the reader looking in the wrong place.
          case "$BASE" in
            https:// | http://)
              echo "failed" > verify-status.txt
              echo "SITE_ORIGIN is empty; set the SITE_URL repository variable" > verify-body.txt
              echo "SITE_ORIGIN is empty; set the SITE_URL repository variable" >&2
              exit 0 ;;
          esac

          echo "$BASE" > verify-origin.txt

          # Retry: a refusal here is often a dropped connection rather than an unreachable site.
          CURL=(curl -sS --location --fail --max-time 20 --retry 5 --retry-delay 5 --retry-all-errors)

          echo "Verifying $BASE"
          sleep 3

          # Any failure in here is captured, not raised: the reason is written to verify-body.txt and the
          # status is decided by whether that file was ever written.
          #
          # Only the health endpoint is asserted to answer with a healthy payload; the frontend serves HTML
          # and is only asserted to be reachable, so passing the payload assertion to it would fail a site
          # that is perfectly fine.
          check() {
            local label="$1" url="$2" file="$3" expect="$4" rc
            # Deliberately not `if ! curl ...`: inside the branch `$?` is the status of the negation, so a
            # refusal would be recorded as "curl 0" instead of the code that explains it. `rc` is declared
            # above rather than assigned with `local rc=$?`, because `local` is itself a command whose
            # status would be the one read.
            "${CURL[@]}" "$url" -o "$file"
            rc=$?
            if [ "$rc" != "0" ]; then
              if [ "$rc" = "35" ]; then
                echo "curl 35: a TLS handshake failure, which is how an edge refusing a datacenter IP looks" > verify-body.txt
              else
                echo "curl $rc: could not fetch $url" > verify-body.txt
              fi
              return 1
            fi
            if [ "$expect" = "payload" ] && ! grep -q '"status":"ok"' "$file"; then
              echo "$url did not answer with a healthy payload" > verify-body.txt
              return 1
            fi
            echo "$label"
            return 0
          }

          echo "Checking $BASE/api/health over HTTPS"
          check "Health endpoint is ok" "$BASE/api/health" health.json payload || failed=1

          echo "Checking the frontend at $BASE/"
          if [ -z "$failed" ]; then
            check "Frontend is reachable" "$BASE/" /dev/null reachable || failed=1
          fi

          echo "Checking the plain-HTTP entry point, which nginx redirects to HTTPS"
          if [ -z "$failed" ]; then
            check "HTTP entry point is ok" "${BASE/https:/http:}/api/health" health-http.json payload || failed=1
          fi

          if [ -z "$failed" ]; then
            echo "passed" > verify-status.txt
          else
            echo "failed" > verify-status.txt
            cat verify-body.txt >&2
          fi

          # Always exit 0: whether the runner could reach the site is a result to report, not a failure.
          exit 0

      # Says out loud what the smoke test found. It does not fail the job, but the result is recorded so
      # "the deploy is green" never quietly hides "the site could not be reached from here".
      - name: Report the smoke test result
        if: always()
        env:
          SITE: ${{ vars.SITE_URL || 'https://kada.click' }}
        run: |
          STATUS=$(cat verify-status.txt 2>/dev/null || echo "failed")
          BODY=$(cat verify-body.txt 2>/dev/null || echo "the smoke test did not run")
          ORIGIN=$(cat verify-origin.txt 2>/dev/null || echo "$SITE")

          if [ "$STATUS" = "passed" ]; then
            echo "$ORIGIN answered over HTTPS, and its API is healthy."
            exit 0
          fi

          {
            echo "### Public smoke test did not pass"
            echo ""
            echo "\`$ORIGIN\` could not be reached from the runner, so DNS, TLS or the edge was not verified by this run."
            echo ""
            echo "Reason: $BODY"
            echo ""
            echo "The deployment itself was checked on the host and is not affected."
            echo ""
            echo "A refusal here is usually the host's edge dropping a connection from a datacenter IP;"
            echo "check it from a normal network before treating it as an outage."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Public smoke test did not pass::$ORIGIN was not reachable from the runner. The deployment itself succeeded (checked on the host)."

  # ----- Summary -----
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build, ai-build, deploy]
    if: always()
    steps:
      - name: Report status
        run: |
          {
            echo "## CI Pipeline Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            for job in backend-lint backend-test frontend-lint frontend-build ai-build deploy; do
              case "$job" in
                backend-lint) result="${{ needs.backend-lint.result }}" ;;
                backend-test) result="${{ needs.backend-test.result }}" ;;
                frontend-lint) result="${{ needs.frontend-lint.result }}" ;;
                frontend-build) result="${{ needs.frontend-build.result }}" ;;
                ai-build) result="${{ needs.ai-build.result }}" ;;
                deploy) result="${{ needs.deploy.result }}" ;;
              esac
              echo "| $job | $result |"
            done
            echo ""
            echo "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
