name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ----- Go lint -----
  backend-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m

  # ----- Go tests -----
  backend-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kada
          POSTGRES_PASSWORD: kada123
          POSTGRES_DB: kada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://kada:kada123@localhost:5432/kada_test?sslmode=disable
          JWT_SECRET: test-secret
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 7

  # ----- Frontend lint -----
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  # ----- Frontend build -----
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ----- Deploy to production -----
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Go binaries
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/server ./cmd/server/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/migrate ./cmd/migrate/

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package frontend
        run: |
          cd frontend
          mkdir -p ../deploy-pkg
          tar czf ../deploy-pkg/kada-fe-standalone.tar.gz -C .next/standalone .
          tar czf ../deploy-pkg/kada-fe-static.tar.gz -C .next static/

      - name: Create deploy marker
        run: |
          echo "${{ github.sha }}" > deploy-version.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deploy-version.txt

      - name: Upload artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "backend/bin/server,backend/bin/migrate,deploy-pkg/*,deploy-version.txt"
          target: /tmp/kada-deploy/
          strip_components: 0

      - name: Apply schema and restart services
        uses: appleboy/ssh-action@v1.2.2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DATABASE_URL
          script: |
            set -euo pipefail

            DEPLOY_DIR=/tmp/kada-deploy
            BACKEND_DIR=/opt/kada/backend
            FRONTEND_DIR=/opt/kada/frontend

            echo "Deploying $(head -1 "$DEPLOY_DIR/deploy-version.txt")"

            # 1. Back up the running binary so a failed start can be rolled back.
            echo "Backing up the current binary"
            mkdir -p "$BACKEND_DIR/backups"
            cp "$BACKEND_DIR/bin/server" "$BACKEND_DIR/backups/server.$(date +%Y%m%d%H%M%S)" 2>/dev/null || true
            ls -t "$BACKEND_DIR"/backups/server.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

            # 2. Apply the database schema.
            # The schema is defined by the GORM models in backend/internal/domain/entity and applied by
            # cmd/migrate: it reconciles legacy constraint names, then runs AutoMigrate (additive only).
            # It reads DATABASE_URL from the environment when the secret is set, and otherwise from
            # /opt/kada/backend/.env through godotenv, which is how this host is configured.
            echo "Applying the database schema"
            cp -f "$DEPLOY_DIR/backend/bin/migrate" "$BACKEND_DIR/bin/migrate"
            chmod +x "$BACKEND_DIR/bin/migrate"
            cd "$BACKEND_DIR" && DATABASE_URL="$DATABASE_URL" ./bin/migrate

            # 3. Replace the backend binary.
            echo "Restarting the backend"
            systemctl stop kada-api
            cp "$DEPLOY_DIR/backend/bin/server" "$BACKEND_DIR/bin/server"
            chmod +x "$BACKEND_DIR/bin/server"
            systemctl start kada-api
            sleep 2

            if ! systemctl is-active --quiet kada-api; then
              echo "kada-api failed to start, rolling back"
              cp "$BACKEND_DIR"/backups/server.* "$BACKEND_DIR/bin/server" 2>/dev/null || true
              systemctl start kada-api || true
              exit 1
            fi
            echo "kada-api is running"

            # 4. Replace the frontend build.
            echo "Deploying the frontend"
            cd "$FRONTEND_DIR"
            rm -rf .next/static node_modules server.js package.json static 2>/dev/null || true
            tar xzf "$DEPLOY_DIR/deploy-pkg/kada-fe-standalone.tar.gz"
            mkdir -p .next
            tar xzf "$DEPLOY_DIR/deploy-pkg/kada-fe-static.tar.gz" -C .next

            # 5. Restart the frontend.
            systemctl restart kada-frontend
            sleep 2
            if ! systemctl is-active --quiet kada-frontend; then
              echo "kada-frontend is not active after restart"
              journalctl -u kada-frontend -n 30 --no-pager || true
              exit 1
            fi
            echo "kada-frontend is running"

            # 6. Clean up.
            rm -rf "$DEPLOY_DIR"
            echo "Deploy finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Runs on the runner, so it proves the deployed service is reachable from the outside and not just
      # that systemd reports the unit as active. A failure here fails the job.
      - name: Verify deployment
        run: |
          set -euo pipefail
          BASE_URL="http://${{ secrets.SERVER_HOST }}"
          sleep 3

          echo "Checking the API health endpoint"
          curl -sS --fail --max-time 15 "$BASE_URL/api/health" | tee health.json
          grep -q '"status":"ok"' health.json
          echo "Health endpoint is ok"

          echo "Checking the frontend"
          curl -sS --fail --max-time 15 -o /dev/null "$BASE_URL/"
          echo "Frontend is reachable"

  # ----- Summary -----
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build, deploy]
    if: always()
    steps:
      - name: Report status
        run: |
          {
            echo "## CI Pipeline Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            for job in backend-lint backend-test frontend-lint frontend-build deploy; do
              case "$job" in
                backend-lint) result="${{ needs.backend-lint.result }}" ;;
                backend-test) result="${{ needs.backend-test.result }}" ;;
                frontend-lint) result="${{ needs.frontend-lint.result }}" ;;
                frontend-build) result="${{ needs.frontend-build.result }}" ;;
                deploy) result="${{ needs.deploy.result }}" ;;
              esac
              echo "| $job | $result |"
            done
            echo ""
            echo "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
