services:
  postgres:
    # pgvector image = the official postgres 16 image plus the vector extension
    # the AI RAG knowledge base requires.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kada
      # Must be overridden via .env in production (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kada123}
      POSTGRES_DB: kada
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on first volume init only: creates the kada_ai database + vector extension
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kada"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # No host port published: the host already has a local redis on 6379, so this redis is for backend inside the docker network only
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://kada:${POSTGRES_PASSWORD:-kada123}@postgres:5432/kada?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: clicks
      # Requires an explicitly provided strong random secret (copy .env.example to .env and fill it in first);
      # the backend also rejects weak secrets such as changeme in release mode
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, for example openssl rand -hex 32; do not use changeme}
      # config.Load reads JWT_EXPIRES_IN / API_BASE_URL, so these must stay in sync or the config is silently ignored
      JWT_EXPIRES_IN: 72h
      API_BASE_URL: http://localhost
      PORT: 8080
      # The schema is owned by GORM AutoMigrate (models live in backend/internal/domain/entity).
      # Production normally runs the migration explicitly (backend/cmd/migrate) and starts the API with
      # this disabled, so a restart can never change the database. In Compose the API applies it first.
      DB_AUTO_MIGRATE: "true"
      # Internal Python AI service reached over the compose network
      AI_BASE_URL: http://ai:8000
      # Shared secret so the AI service accepts only requests from this gateway
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Python AI assistant. Internal only (no host port): the Go gateway proxies
  # /api/ai/* to it after JWT authentication. MCP callbacks go back to Go.
  #
  # This is the one-host stack (everything on one machine, as in local
  # development). On a server that already runs its own PostgreSQL and Redis,
  # the depends_on below would try to start compose's postgres too and collide
  # on 127.0.0.1:5432, so either start it with `--no-deps` or, better, use the
  # production file deploy/docker-compose.ai.yml, which can only start this one
  # service. See backend/ai/README.md.
  ai:
    build: ./backend/ai
    environment:
      POSTGRES_URL: postgresql+asyncpg://kada:${POSTGRES_PASSWORD:-kada123}@postgres:5432/kada_ai
      REDIS_URL: redis://redis:6379/0
      KADA_API_BASE: http://backend:8080
      # Keys come from .env; empty values let the container start so a missing
      # AI key never blocks the rest of the stack.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      aliyun: ${aliyun:-}
      # Must match the backend's AI_INTERNAL_SECRET; empty disables the check.
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:-}
      # No long-lived API token here on purpose: the tools that read link
      # statistics or create short links run as the signed-in user, using the
      # JWT the Go gateway forwards on every chat request.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # "same-origin" keeps requests relative: nginx serves the frontend and proxies /api/ to the
        # backend. This has to be a build arg, not `environment`, because Next.js inlines
        # NEXT_PUBLIC_* at build time - a runtime environment variable here would have no effect.
        NEXT_PUBLIC_API_URL: "same-origin"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports:
      # 9092 is for the docker network (backend/worker use kafka:9092) and is not published to the host
      # 29092 is for the host (running server/worker locally uses localhost:29092)
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-worker:
    build: ./backend
    command: ["/worker"]
    environment:
      DATABASE_URL: postgres://kada:${POSTGRES_PASSWORD:-kada123}@postgres:5432/kada?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: clicks
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
