services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kada
      POSTGRES_PASSWORD: kada123
      POSTGRES_DB: kada
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kada"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # 不发布宿主端口：宿主已有本地 redis 占用 6379，此 redis 仅供 docker 内网 backend 使用
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://kada:kada123@postgres:5432/kada?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: clicks
      # 强制要求显式提供强随机密钥（可先复制 .env.example 为 .env 并填写），
      # 后端 release 模式也会拒绝 changeme 等弱密钥
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置，例如 openssl rand -hex 32，禁止使用 changeme}
      JWT_EXPIRES: 72h
      BASE_URL: http://localhost
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports:
      # 9092 供 docker 内网（backend/worker 用 kafka:9092），不发布到宿主机
      # 29092 供宿主机（本机跑 server/worker 用 localhost:29092）
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-worker:
    build: ./backend
    command: ["/worker"]
    environment:
      DATABASE_URL: postgres://kada:kada123@postgres:5432/kada?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: clicks
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
